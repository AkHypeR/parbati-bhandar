name: Verify Cloudflare Pages and Node API

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit and API tests
        run: npm test
      - name: Check Node API JavaScript syntax
        run: for file in server/*.js; do node --check "$file"; done
      - name: Build Cloudflare Pages site
        run: npm run build
